AWSTemplateFormatVersion: '2010-09-09'
Description: Private application-wide S3 storage for Boero files (no antivirus or expiry)
Parameters:
  BucketName:
    Type: String
    Description: Globally unique name; use a different bucket per environment
  ObjectPrefix:
    Type: String
    Default: boero/
    AllowedPattern: '[A-Za-z0-9][A-Za-z0-9/_-]*/'
    Description: Must match STORAGE_S3_PREFIX, including its trailing slash
Resources:
  DocumentsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref BucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      # Deliberately omit VersioningConfiguration, ObjectLock and LifecycleConfiguration.
      # New buckets remain unversioned, unlocked and without automatic expiry.
  DocumentsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DocumentsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt DocumentsBucket.Arn
              - !Sub '${DocumentsBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'
  ApiDocumentsPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Attach only to the Boero API role or dedicated IAM identity
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ManageApplicationObjects
            Effect: Allow
            Action:
              - s3:PutObject
              - s3:GetObject
              - s3:DeleteObject
            Resource: !Sub '${DocumentsBucket.Arn}/${ObjectPrefix}*'
Outputs:
  Bucket:
    Value: !Ref DocumentsBucket
  Region:
    Value: !Ref AWS::Region
  Prefix:
    Value: !Ref ObjectPrefix
  ApiPolicyArn:
    Value: !Ref ApiDocumentsPolicy
